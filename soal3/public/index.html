<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voucher Kas Keluar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Voucher Kas Keluar <small>PT Diponegoro Logistik Utama · Modul General Ledger</small></h1>
  <div id="who" class="row hide"><span id="whoName"></span><button class="sm" onclick="logout()">Keluar</button></div>
</header>

<section id="login" class="card">
  <h2>Masuk</h2>
  <div style="margin-bottom:10px"><label>Username</label><input id="lu" value="rina@diponegoro-logistik.id"></div>
  <div style="margin-bottom:10px"><label>Password</label><input id="lp" type="password" value="kas12345"></div>
  <div id="lmsg" class="msg"></div>
  <button class="pri" onclick="login()">Masuk</button>
</section>

<main id="app" class="hide">
  <section class="card">
    <h2>Entri Voucher Kas Keluar</h2>
    <div class="grid3">
      <div><label>Tanggal transaksi</label><input id="fDate" type="date"></div>
      <div><label>No. bukti</label><input id="fRef"></div>
      <div><label>Klasifikasi arus kas (PSAK 207)</label>
        <select id="fAct"><option>OPERASI</option><option>INVESTASI</option><option>PENDANAAN</option></select></div>
    </div>
    <div style="margin-bottom:10px"><label>Deskripsi / dibayarkan kepada</label><input id="fDesc" placeholder="mis. Pembayaran listrik dan telepon Oktober kepada PLN/Telkom"></div>

    <div class="tw"><table style="min-width:480px">
      <thead><tr><th>#</th><th>Akun</th><th class="num">Debit (Rp)</th><th class="num">Kredit (Rp)</th><th></th></tr></thead>
      <tbody id="lines"></tbody>
      <tfoot><tr class="tot"><td colspan="2"><button class="sm" onclick="addLine()">+ Tambah baris</button></td><td class="num" id="tD">0</td><td class="num" id="tC">0</td><td></td></tr></tfoot>
    </table></div>

    <div id="badge" class="badge bad"><span id="bTxt">TIDAK SEIMBANG</span><span id="bDiff"></span></div>
    <ul class="rules" id="rules"></ul>
    <div id="msg" class="msg"></div>
    <div class="row"><button id="btnSubmit" class="pri" disabled onclick="submitV()">Submit &amp; Posting</button><button onclick="resetForm()">Kosongkan form</button></div>
  </section>

  <section class="card">
    <div class="tabs">
      <button id="tabJ" class="on" onclick="tab('J')">Jurnal Terposting</button>
      <button id="tabA" onclick="tab('A')">Audit Log</button>
      <button class="sm" style="margin-left:auto" onclick="verify()">Verifikasi hash</button>
    </div>
    <div id="vmsg" class="msg"></div>
    <div style="margin-bottom:10px"><label for="reason">Alasan jurnal pembalik (wajib diisi sebelum menekan tombol storno)</label><input id="reason" placeholder="mis. Salah input nominal listrik"></div>
    <div id="paneJ"></div>
    <div id="paneA" class="hide"></div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
